<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signature E-mail — Sokoun</title>
  <style>
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7f6f0;
      color: #2c2c2c;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .header-info {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-info h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2c2c2c;
      margin: 0 0 8px 0;
    }

    .header-info p {
      font-size: 14px;
      color: #666;
      margin: 0;
    }

    .actions-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      background-color: #a89bc1;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(168, 155, 193, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #9686b2;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #2c2c2c;
      border: 1px solid #d4d1c5;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .btn-secondary:hover {
      background-color: #f4f3ec;
    }

    /* Signature Card Preview */
    .signature-card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e7e5dc;
    }

    /* Email Signature HTML Table (Client-compatible) */
    #email-signature-content {
      display: inline-block;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-info">
      <h1>Signature E-mail Officielle — Sokoun</h1>
      <p>Conçue selon votre charte graphique. Cliquez sur le bouton pour copier la signature et la coller dans Gmail, Outlook ou Apple Mail.</p>
    </div>

    <div class="actions-bar">
      <button class="btn" onclick="copySignature()">
        📋 Copier la signature visuelle
      </button>
      <button class="btn btn-secondary" onclick="copyHTML()">
        &lt;/&gt; Copier le code HTML
      </button>
    </div>

    <div class="signature-card" style="text-align: center;">
      <div id="email-signature-content">
        <!-- EXACT SIGNATURE IMAGE -->
        <a href="https://www.soukoun.com" target="_blank" style="display: inline-block; text-decoration: none;">
          <img
            src="/signature-mail.jpg"
            alt="Signature E-mail Sokoun"
            style="max-width: 100%; width: 750px; height: auto; display: block; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.06);"
          />
        </a>
      </div>
    </div>
  </div>

  <script>
    function copySignature() {
      const el = document.getElementById('email-signature-content');
      const range = document.createRange();
      range.selectNode(el);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      try {
        document.execCommand('copy');
        alert('✅ Signature visuelle copiée dans le presse-papier ! Vous pouvez maintenant la coller (Ctrl+V) dans les paramètres de votre boîte mail.');
      } catch (err) {
        alert('Erreur lors de la copie.');
      }
      window.getSelection().removeAllRanges();
    }

    function copyHTML() {
      const el = document.getElementById('email-signature-content');
      navigator.clipboard.writeText(el.innerHTML).then(() => {
        alert('✅ Code HTML de la signature copié dans le presse-papier !');
      });
    }
  </script>
</body>
</html>
